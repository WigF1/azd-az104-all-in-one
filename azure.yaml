name: tdd-azd-az104allinone 
metadata:
  template:  tdd-azd-az104allinone@0.0.1-beta
infra:
  provider: bicep   # (default; you can omit this line)
  path: infra       # relative path to all your .bicep files
  module: main      # the single entry-point .bicep file
  # Note: This file does not automatically load infra/main.parameters.json.
  # Provide deployment parameters via the azd CLI/options documented for this template.

hooks:
  postdown:
    shell: pwsh
    interactive: true
    continueOnError: true
    run: |
      # azd exposes the environment's values (AZURE_LOCATION, AZURE_RESOURCE_GROUP, ...) to hooks
      $location = $env:AZURE_LOCATION
      $rg       = $env:AZURE_RESOURCE_GROUP
      Write-Host "Cleaning up resources that live outside the resource group..." -ForegroundColor Yellow

      # 1. Connection Monitor (lives in NetworkWatcherRG, not in the azd resource group)
      if ($location) {
        az network watcher connection-monitor delete --name az104-cm-web-backends --location $location 2>$null
        if ($LASTEXITCODE -eq 0) { Write-Host "✓ Connection monitor deleted" -ForegroundColor Green }
        else { Write-Host "ℹ No connection monitor found" -ForegroundColor Gray }
      }

      # 2. Subscription-scoped governance: custom role + policy initiative.
      #    Deleting the deployment record alone does NOT delete the resources it created.
      if ($rg) {
        $roleName = "VM Support Engineer ($rg)"
        $role = az role definition list --custom-role-only true --name $roleName --query "[0].name" -o tsv 2>$null
        if ($role) {
          az role definition delete --name $roleName 2>$null
          Write-Host "✓ Custom role '$roleName' deleted" -ForegroundColor Green
        } else { Write-Host "ℹ No custom role '$roleName' found" -ForegroundColor Gray }

        $initiatives = az policy set-definition list --query "[?displayName=='Virtual Machine Governance for $rg'].name" -o tsv 2>$null
        foreach ($name in ($initiatives -split "`n" | Where-Object { $_ })) {
          az policy set-definition delete --name $name 2>$null
          Write-Host "✓ Policy initiative '$name' deleted" -ForegroundColor Green
        }
      } else {
        Write-Host "ℹ AZURE_RESOURCE_GROUP not set; skipping custom role and policy cleanup" -ForegroundColor Gray
      }

      if ($location) { az deployment sub delete --name "governance-$location" 2>$null }
      Write-Host "Cleanup finished. Policy assignments made by hand in class are not removed." -ForegroundColor Yellow
